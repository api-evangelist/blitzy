name: Blitzy
description: >-
  Blitzy is an autonomous software development platform for enterprises with
  large legacy codebases. It reverse-engineers existing code into a knowledge
  graph, then orchestrates thousands of AI agents to modernize software and
  build new applications at the scale of 1 million to over 100 million lines of
  code, autonomously completing roughly 80% of a project before human engineers
  review and approve the result. Rather than training its own foundation models,
  Blitzy composes leading third-party models (Gemini, GPT, Claude). Founded by
  Brian Elliott (CEO) and Sid Pardeshi (CTO), the company is headquartered in
  Cambridge, Massachusetts with an office in Pune, India, and is backed by
  Northzone.
